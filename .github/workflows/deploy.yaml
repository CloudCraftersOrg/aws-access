name: Terraform

# This repo is public, so two things need care:
#
#   1. Fork pull requests must not reach AWS. GitHub issues no OIDC token for
#      them, so the plan job simply fails for forks — that is intended. The
#      trigger is pull_request, never pull_request_target.
#   2. Actions logs here are world-readable, and plan output resolves real
#      account IDs and ARNs. Nothing marks them sensitive, so the protection is
#      procedural: the plan is never echoed and never posted as a comment. Only
#      add/change/destroy counts go to the job summary. The full plan is a
#      run artifact, which is readable by anyone who can read the repo.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: 'true'

concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive -diff

      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color

      # Third-party action. Consider pinning to a commit SHA; tags are mutable.
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.53.0

      - name: TFLint
        run: tflint --no-color

  terraform:
    name: Plan and Apply
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # Only bucket and key are passed here; region and encrypt live in
      # config.tf. The key must stay under the aws-access/ prefix, because the
      # IAM role's S3 policy is scoped to a prefix named after this repo.
      - name: Init
        run: |
          terraform init -lock-timeout=5m \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_STATE_KEY }}"

      - name: Plan
        run: terraform plan -no-color -lock-timeout=5m -out=tfplan

      # Counts only, so nothing resolved lands in the public log. plan.json is
      # the machine-readable form from `terraform show -json`, not rendered plan
      # text; the binary tfplan is not uploaded, so it cannot be re-rendered.
      - name: Summarize
        run: |
          terraform show -json tfplan > plan.json
          add=$(jq '[.resource_changes[]?|select(.change.actions|index("create"))]|length' plan.json)
          chg=$(jq '[.resource_changes[]?|select(.change.actions|index("update"))]|length' plan.json)
          del=$(jq '[.resource_changes[]?|select(.change.actions|index("delete"))]|length' plan.json)
          {
            echo "### Plan: ${add} to add, ${chg} to change, ${del} to destroy"
            echo ""
            echo "Full plan is in the \`plan\` artifact on this run."
            if [ "${del}" != "0" ]; then
              echo ""
              echo ":warning: This plan destroys ${del} resource(s). Destroying a"
              echo "permission set or an assignment removes access. Review the"
              echo "artifact before merging."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        uses: actions/upload-artifact@v7
        with:
          name: plan
          path: plan.json
          retention-days: 7

      # Applies the plan saved earlier in THIS run. The pull request's plan does
      # not carry over — the post-merge run plans again from scratch, so the PR
      # plan is a preview, not the artifact that gets applied.
      - name: Apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: terraform apply -auto-approve -lock-timeout=5m tfplan
